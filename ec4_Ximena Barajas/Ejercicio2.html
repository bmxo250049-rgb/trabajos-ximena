<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Juguetería - Peso del paquete</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <div class="container">
        <div class="encabezado encabezado-naranja">
            <h1>Juguetería</h1>
            <p class="mb-0">Cálculo del peso del paquete (Payasos y Muñecas)</p>
        </div>

        <!-- Ejemplo visual de ambos productos -->
        <div class="row g-3 text-center mb-4">
            <div class="col-6">
                <div class="ejemplo-card h-100">
                    <div style="font-size: 62px; line-height: 1.1;">🤡</div>
                    <h5 class="fw-bold mt-2 mb-1 text-dark">Payaso de Juguete</h5>
                    <span class="badge bg-warning text-dark fs-6">Peso: 112 g c/u</span>
                </div>
            </div>
            <div class="col-6">
                <div class="ejemplo-card h-100">
                    <div style="font-size: 62px; line-height: 1.1;">🪆</div>
                    <h5 class="fw-bold mt-2 mb-1 text-dark">Muñeca de Colección</h5>
                    <span class="badge bg-info text-dark fs-6">Peso: 104 g c/u</span>
                </div>
            </div>
        </div>

        <form action="Ejercicio2.php" method="post">
            <table class="table table-bordered bg-white">
                <tr>
                    <th>Payasos vendidos (Npayaso)</th>
                    <td><input type="number" name="npayasos" class="form-control" min="0" step="1" placeholder="Ej. 5" required></td>
                </tr>
                <tr>
                    <th>Muñecas vendidas (Nmunecas)</th>
                    <td><input type="number" name="nmunecas" class="form-control" min="0" step="1" placeholder="Ej. 3" required></td>
                </tr>
            </table>
            <div class="d-flex gap-2 flex-wrap">
                <button type="submit" class="btn btn-warning">Calcular peso total</button>
                <a href="index.html" class="btn btn-secondary">Regresar al menú</a>
            </div>
        </form>
    </div>
</body>
</html>
