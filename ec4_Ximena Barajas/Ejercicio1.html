<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Six Flags Morelos - Venta de boletos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <div class="container">
        <div class="encabezado encabezado-azul">
            <h1>Six Flags Morelos</h1>
            <p class="mb-0">Venta de boletos - Parque acuático (Precio normal: $2,673.00 c/u)</p>
        </div>

        <form action="Ejercicio1.php" method="post">
            <table class="table table-bordered bg-white">
                <tr>
                    <th>Nombre del visitante</th>
                    <td><input type="text" name="nombre" class="form-control" placeholder="Ej. Ximena Barajas" required></td>
                </tr>
                <tr>
                    <th>Número de boletos</th>
                    <td><input type="number" name="boletos" class="form-control" min="1" step="1" value="1" required></td>
                </tr>
                <tr>
                    <th>¿Cuenta con membresía?</th>
                    <td>
                        <select name="membresia" class="form-select">
                            <option value="ninguna">Sin membresía (0% descuento - $2,673 c/u)</option>
                            <option value="plata">Membresía Plata (25% de descuento)</option>
                            <option value="oro">Membresía Oro (50% de descuento)</option>
                            <option value="platino">Membresía Platino (65% de descuento)</option>
                        </select>
                    </td>
                </tr>
            </table>
            <div class="d-flex gap-2 flex-wrap">
                <button type="submit" class="btn btn-danger">Cobrar y generar ticket</button>
                <a href="index.html" class="btn btn-secondary">Regresar al menú</a>
            </div>
        </form>
    </div>
</body>
</html>
