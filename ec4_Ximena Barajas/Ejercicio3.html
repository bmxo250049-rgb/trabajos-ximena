<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Salario semanal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <div class="container">
        <div class="encabezado encabezado-verde">
            <h1>Salario semanal</h1>
            <p class="mb-0">$16.00 por hora (primeras 40 horas) y $20.00 por hora extra</p>
        </div>

        <form action="Ejercicio3.php" method="post">
            <table class="table table-bordered bg-white">
                <tr>
                    <th>Nombre completo del trabajador</th>
                    <td><input type="text" name="nombre" class="form-control" placeholder="Ej. Juan Pérez López" required></td>
                </tr>
                <tr>
                    <th>Horas trabajadas en la semana</th>
                    <td><input type="number" name="horas" class="form-control" min="0" max="168" step="0.5" placeholder="Ej. 45" required></td>
                </tr>
            </table>
            <div class="d-flex gap-2 flex-wrap">
                <button type="submit" class="btn btn-success">Generar recibo de pago</button>
                <a href="index.html" class="btn btn-secondary">Regresar al menú</a>
            </div>
        </form>
    </div>
</body>
</html>
