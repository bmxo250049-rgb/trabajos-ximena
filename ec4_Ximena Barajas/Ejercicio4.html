<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Frutería - Descuento en manzanas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <div class="container">
        <div class="encabezado encabezado-rojo">
            <h1>🍎 Frutería</h1>
            <p class="mb-0">Tabla de descuentos por kilos de manzana comprados</p>
        </div>

        <div class="resultado-card mb-4">
            <h5 class="fw-bold text-center text-danger mb-3">Promociones vigentes por volumen</h5>
            <table class="table table-bordered table-sm text-center mb-0">
                <thead class="table-danger">
                    <tr>
                        <th>Número de kilos comprados</th>
                        <th>% Descuento</th>
                    </tr>
                </thead>
                <tbody>
                    <tr><td>0 - 2 kg</td><td>0%</td></tr>
                    <tr><td>2.01 - 5 kg</td><td>10%</td></tr>
                    <tr><td>5.01 - 10 kg</td><td>15%</td></tr>
                    <tr><td>10.01 kg en adelante</td><td>20%</td></tr>
                </tbody>
            </table>
        </div>

        <form action="Ejercicio4.php" method="post">
            <table class="table table-bordered bg-white">
                <tr>
                    <th>Kilos de manzana comprados</th>
                    <td><input type="number" name="kilos" class="form-control" min="0.01" step="0.01" placeholder="Ej. 6.5" required></td>
                </tr>
                <tr>
                    <th>Precio por kilo ($)</th>
                    <td><input type="number" name="precio" class="form-control" min="0.01" step="0.01" placeholder="Ej. 45.00" required></td>
                </tr>
            </table>
            <div class="d-flex gap-2 flex-wrap">
                <button type="submit" class="btn btn-danger">Calcular total a pagar</button>
                <a href="index.html" class="btn btn-secondary">Regresar al menú</a>
            </div>
        </form>
    </div>
</body>
</html>
