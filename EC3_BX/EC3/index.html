<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Formulario de Registro</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="container contenedor-form">
    <h1 class="text-center titulo">Formulario de Registro</h1>
 
    <form id="formRegistro" novalidate>
 
      <div class="mb-3">
        <label for="nombre" class="form-label fw-bold">Nombre:</label>
        <input type="text" id="nombre" class="form-control campo" maxlength="60">
        <div id="msg-nombre"></div>
      </div>
 
      <div class="mb-3">
        <label for="apellido" class="form-label fw-bold">Apellido:</label>
        <input type="text" id="apellido" class="form-control campo" maxlength="60">
        <div id="msg-apellido"></div>
      </div>
 
      <div class="mb-3">
        <label for="direccion" class="form-label fw-bold">Dirección:</label>
        <input type="text" id="direccion" class="form-control campo" maxlength="60">
        <div id="msg-direccion"></div>
      </div>
 
      <div class="mb-3">
        <label for="telefono" class="form-label fw-bold">Teléfono:</label>
        <input type="text" id="telefono" class="form-control campo" maxlength="20" inputmode="numeric">
        <div id="msg-telefono"></div>
      </div>
 
      <div class="mb-3">
        <label for="email" class="form-label fw-bold">E-mail:</label>
        <input type="text" id="email" class="form-control campo">
        <div id="msg-email"></div>
      </div>
 
      <div class="mb-3">
        <span class="form-label fw-bold d-block">Género:</span>
        <div class="form-check form-check-inline">
          <input class="form-check-input genero" type="radio" name="genero" id="generoMujer" value="Mujer">
          <label class="form-check-label fw-bold" for="generoMujer">Mujer:</label>
        </div>
        <div class="form-check form-check-inline">
          <input class="form-check-input genero" type="radio" name="genero" id="generoHombre" value="Hombre">
          <label class="form-check-label fw-bold" for="generoHombre">Hombre:</label>
        </div>
        <div class="form-check form-check-inline">
          <input class="form-check-input genero" type="radio" name="genero" id="generoOtro" value="Otro">
          <label class="form-check-label fw-bold" for="generoOtro">Otro:</label>
        </div>
        <div id="msg-genero"></div>
      </div>
 
      <div class="mb-3">
        <span class="form-label fw-bold d-block">¿Deseas hacer un comentario?</span>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="radio" name="deseaComentario" id="comentarioSi" value="si">
          <label class="form-check-label fw-bold" for="comentarioSi">Sí</label>
        </div>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="radio" name="deseaComentario" id="comentarioNo" value="no" checked>
          <label class="form-check-label fw-bold" for="comentarioNo">No</label>
        </div>
      </div>
 
      <div class="mb-3 d-none" id="bloqueComentarios">
        <label for="comentarios" class="form-label fw-bold">Comentarios:</label>
        <textarea id="comentarios" class="form-control campo" rows="4"></textarea>
        <div class="form-text">Entre 20 y 128 caracteres.</div>
        <div id="msg-comentarios"></div>
      </div>
 
      <div id="msg-exito"></div>
 
<button type="button" class="btn btn-dark w-100 fw-bold boton-enviar" onclick="validarFormulario()">Enviar Datos</button>    </form>
 
    <p class="text-center pie"> BARAJAS MARTINEZ XIMENA </p>
  </main>
 
<p><a href="../index.html">&larr; Volver al menú</a></p>
  <script src="js/validaciones.js"></script>
</body>
</html>
